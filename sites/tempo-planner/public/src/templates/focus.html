    body { margin: 0; }
  
html,body{margin:0;min-height:100%;}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #C17A3A;outline-offset:2px;}</style></head><body>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 24px; display: flex; flex-direction: column; gap: 20px; background: #14202E; color: #F2F5F9; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <button style="min-height: 44px; padding: 0 12px; border: 1px solid #4A5B70; border-radius: 10px; background: transparent; color: #F2F5F9; font: inherit; font-size: 15px">Back</button>
    <span style="font-size: 14px; color: #B7C2D0; letter-spacing: 0.04em; text-transform: uppercase">Session 1 of 2</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; text-align: center">
    <span style="font-size: 14px; color: #B7C2D0">Working on</span>
    <span style="font-size: 22px; font-weight: 700; line-height: 1.25">Draft the budget summary</span>
  </div>

  <div style="display: flex; justify-content: center">
    <svg width="260" height="260" sc-camel-view-box="0 0 260 260" role="img" aria-label="18 minutes 42 seconds left of 25">
      <circle cx="130" cy="130" r="112" fill="none" stroke="#2A3B50" stroke-width="16"></circle>
      <circle cx="130" cy="130" r="112" fill="none" stroke="#7FB2FF" stroke-width="16" stroke-linecap="round" transform="rotate(-90 130 130)" stroke-dasharray="704 704" stroke-dashoffset="265"></circle>
      <text x="130" y="128" text-anchor="middle" fill="#F2F5F9" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="52" font-weight="700">18:42</text>
      <text x="130" y="160" text-anchor="middle" fill="#B7C2D0" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="16">of 25 min</text>
    </svg>
  </div>

  <div style="display: flex; gap: 10px">
    <button style="flex: 1; min-height: 52px; border: 0; border-radius: 12px; background: #7FB2FF; color: #0E1A2B; font: inherit; font-size: 17px; font-weight: 700">Pause</button>
    <button style="flex: 1; min-height: 52px; border: 2px solid #F2F5F9; border-radius: 12px; background: transparent; color: #F2F5F9; font: inherit; font-size: 17px; font-weight: 700">Done</button>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; background: #1D2B3D; border-radius: 12px; padding: 0 14px">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 16px; font-weight: 700">Body double</span>
      <span style="font-size: 13px; color: #B7C2D0">Silent co-working timer, no camera</span>
    </div>
    <div style="width: 52px; height: 30px; border-radius: 15px; background: #7FB2FF; position: relative">
      <div style="position: absolute; right: 4px; top: 4px; width: 22px; height: 22px; border-radius: 11px; background: #0E1A2B"></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; font-weight: 700; color: #B7C2D0; letter-spacing: 0.04em; text-transform: uppercase">Break menu</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <span style="min-height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border: 1px solid #4A5B70; border-radius: 999px; font-size: 15px">Stretch 2 min</span>
      <span style="min-height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border: 1px solid #4A5B70; border-radius: 999px; font-size: 15px">Tea</span>
      <span style="min-height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border: 1px solid #4A5B70; border-radius: 999px; font-size: 15px">One song</span>
    </div>
  </div>

  <div style="margin-top: auto; background: #1D2B3D; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 14px; color: #B7C2D0">Stuck? Smallest next step</span>
    <span style="font-size: 16px; font-weight: 700">Open the budget file and read the first row</span>
  </div>
</div>
