*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:#1B2430;background:#F5F7F9}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #C17A3A;outline-offset:2px}button{font-family:inherit}#plan{width:390px;min-height:844px;padding:56px 20px 100px;display:flex;flex-direction:column;gap:14px;position:relative;background:#F5F7F9}#plan h1{font-size:28px;margin:0}#plan .sub{font-size:15px;color:#4A5565;margin-top:-10px}.section{font-size:14px;font-weight:700;color:#4A5565;letter-spacing:.04em;text-transform:uppercase}.group{display:flex;flex-direction:column;gap:8px}.row{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;min-height:52px;padding:7px 14px;border:0;border-radius:10px;background:white;color:#1B2430;font-size:16px;gap:12px}.row small{display:block;font-size:13px;color:#4A5565;margin-top:3px}.row .duration{font-size:14px;white-space:nowrap;color:#4A5565}.later{background:#E9EEF6;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}.add{min-height:48px;border:1px solid #1B2430;border-radius:10px;background:transparent;color:#1B2430;font-size:16px;font-weight:700}.settings-link{align-self:flex-end;border:0;background:transparent;color:#1B4FA8;font-size:15px;text-decoration:underline;text-underline-offset:3px}.nav{position:absolute;left:0;right:0;bottom:0;height:84px;padding-top:10px;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #D5DCE6}.nav button{min-height:48px;padding:0 4px;border:0;background:transparent;color:#4A5565;font:inherit;font-size:14px}.nav button[aria-current=page]{font-weight:700;color:#1B4FA8}@media(max-width:389px){#plan{width:100vw;padding-left:16px;padding-right:16px}}@media(max-height:843px){#plan{min-height:100dvh}}
</style></head><body><main id="plan" aria-labelledby="plan-title"><h1 id="plan-title">Plan</h1><p class="sub">Place tasks in a day when you are ready.</p><button class="settings-link" type="button" data-route="settings">Settings</button><section class="group" aria-labelledby="today-label"><span id="today-label" class="section">Today</span><div id="today-items"></div></section><section class="group" aria-labelledby="week-label"><span id="week-label" class="section">This week</span><div id="week-items"></div></section><section class="group" aria-labelledby="later-label"><span id="later-label" class="section">Later</span><div id="later-items"></div></section><section class="group" aria-labelledby="completed-label"><span id="completed-label" class="section">Completed</span><div id="completed-items"></div></section><button id="add-task" class="add" type="button">Add a task</button><div class="later">Unscheduled items stay here until you choose a day for them.</div><nav class="nav" aria-label="Main navigation"><button type="button" data-route="today">Today</button><button type="button" data-route="plan" aria-current="page">Plan</button><button type="button" data-route="focus">Focus</button><button type="button" data-route="brain-dump">Brain dump</button></nav></main></body></html>
