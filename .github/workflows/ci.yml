name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  root:
    name: Root PWA (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  site:
    name: Hosted Site (install + lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        workdir: sites/tempo-planner
      - run: npm run lint
        workdir: sites/tempo-planner
      - run: npm test
        workdir: sites/tempo-planner
